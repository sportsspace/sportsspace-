<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Space · Sports News</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- External CSS (separated) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="container">
      <div class="logo">
        <i class="fas fa-basketball-ball"></i>
        <span>Sports</span>Space
      </div>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="#"><i class="fas fa-home"></i> Home</a>
        <a href="#"><i class="fas fa-futbol"></i> Football</a>
        <a href="#"><i class="fas fa-basketball-ball"></i> Basketball</a>
        <a href="#"><i class="fas fa-baseball-ball"></i> Baseball</a>
        <a href="#"><i class="fas fa-pen-fancy"></i> Opinion</a>
      </div>
    </div>
  </nav>

  <main class="container">

    <!-- ===== HERO ===== -->
    <section class="hero">
      <div class="hero-content">
        <span class="hero-tag"><i class="fas fa-bolt"></i> BREAKING</span>
        <h1 id="hero-title">Mega trade shakes up the league</h1>
        <p id="hero-excerpt">In a blockbuster 5-team deal, the reigning scoring champion heads to the Lakers.</p>
        <div class="hero-meta">
          <span id="hero-author"><i class="fas fa-user-edit"></i> by Marc Stein</span>
          <span id="hero-date"><i class="fas fa-clock"></i> 2 hours ago</span>
        </div>
      </div>
    </section>

    <!-- ===== LATEST NEWS GRID ===== -->
    <div class="section-title">
      <i class="fas fa-newspaper"></i>
      <span>Latest News</span>
    </div>
    <div class="grid-3" id="article-grid">
      <!-- Articles will be loaded here dynamically from /articles/ -->
    </div>

    <!-- ===== FEATURED + SIDEBAR ===== -->
    <div class="featured-grid">
      <section class="featured-main">
        <h2><i class="fas fa-star"></i> Editor's Picks</h2>
        <div id="featured-list" class="big-news">
          <!-- Featured articles loaded here -->
        </div>
      </section>
      <aside class="sidebar">
        <div class="sidebar-card">
          <h3><i class="fas fa-fire"></i> Trending</h3>
          <ul class="sidebar-list" id="trending-list">
            <!-- Trending loaded here -->
          </ul>
        </div>
      </aside>
    </div>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-logo"><i class="fas fa-basketball-ball"></i> SportsSpace</div>
        <div class="footer-social">
          <i class="fab fa-twitter"></i>
          <i class="fab fa-instagram"></i>
          <i class="fab fa-youtube"></i>
        </div>
      </div>
      <div class="footer-copy">&copy; 2026 Sports Space. All rights reserved.</div>
    </div>
  </footer>

  <!-- External JavaScript (separated) -->
  <script src="js_main.js"></script>
</body>
</html>
